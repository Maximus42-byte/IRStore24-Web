# REVIEWED LOCATION TEMPLATE, NOT A COMPLETE VIRTUAL HOST.
# Include these directives inside the existing HTTPS server block only after
# inspecting the live Nginx configuration and verifying TLS/redirect rules.
# The host paths and ports below are proposed values, not observed VPS state.
# This file must not replace the existing live configuration by itself.

client_max_body_size 1m;

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /api {
    return 404;
}

# Serve only image filenames within the dedicated persistent media directory.
# The capture prevents traversal and the alias cannot address arbitrary paths.
location ~* ^/media/(?<media_asset>(?:[a-z0-9_-]+/)*[a-z0-9_-]+\.(?:png|jpe?g|webp|gif|avif))$ {
    alias /srv/irstore24/media/$media_asset;
    disable_symlinks on;
    autoindex off;
    limit_except GET { deny all; }
    add_header X-Content-Type-Options nosniff always;
}

location /media/ {
    return 404;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
