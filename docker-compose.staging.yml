# Use only with docker-compose.yml and an explicit staging project name.
# The !override tag requires Docker Compose 2.24.4 or newer; validate on host.
name: irstore24-staging

services:
  web:
    ports: !override
      - "127.0.0.1:3100:3000"

  api:
    ports: !override
      - "127.0.0.1:8100:8000"

  db:
    ports: !override []
