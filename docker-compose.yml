name: irstore24

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the selected environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the selected environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected environment file}
      DB_HOST: db
      DB_PORT: "5432"
      APP_ENV: production
      AUTH_COOKIE_SECURE: "true"
      AUTH_ALLOWED_ORIGINS: '["https://irstore24.ir","https://www.irstore24.ir"]'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/database', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the selected environment file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the selected environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the selected environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
